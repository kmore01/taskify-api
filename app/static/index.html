<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f5f6f8"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1218"
    />
    <meta
      name="description"
      content="Taskify: tacha tus tareas y empieza a organizarte."
    />
    <title>Taskify</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <!-- Auth -->
    <section id="view-auth" class="auth" aria-labelledby="auth-title">
      <div class="auth__grid">
        <div class="auth__intro">
          <p class="brand brand--big">
            <span class="brand__mark" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                focusable="false"
              >
                <path d="m5 12 4.5 4.5L19 7" />
              </svg>
            </span>
            Taskify
          </p>
          <h1 id="auth-title" class="auth__title">
            Tus tareas, ordenadas y selladas.
          </h1>
          <p class="auth__lead">
            Entra o crea una cuenta. Cuando termines algo, cae el cuño.
          </p>
        </div>

        <div class="auth__panel">
          <div class="tabs" role="tablist" aria-label="Acceso">
            <button
              id="tab-login"
              class="tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="form-login"
            >
              Entrar
            </button>
            <button
              id="tab-register"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="form-register"
              tabindex="-1"
            >
              Crear cuenta
            </button>
          </div>

          <!-- Login -->
          <form
            id="form-login"
            class="form"
            role="tabpanel"
            aria-labelledby="tab-login"
            novalidate
          >
            <label class="field">
              <span class="field__label">Usuario</span>
              <input name="username" autocomplete="username" required />
            </label>
            <label class="field">
              <span class="field__label">Contraseña</span>
              <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </label>
            <div class="form__actions">
              <button class="btn btn--primary" type="submit">Entrar</button>
            </div>
          </form>

          <!-- Register -->
          <form
            id="form-register"
            class="form"
            role="tabpanel"
            aria-labelledby="tab-register"
            hidden
            novalidate
          >
            <label class="field">
              <span class="field__label">Usuario</span>
              <input
                name="username"
                autocomplete="username"
                required
                minlength="3"
              />
            </label>
            <label class="field">
              <span class="field__label">Correo</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="field">
              <span class="field__label">Contraseña</span>
              <input
                type="password"
                name="password"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </label>
            <div class="form__actions">
              <button class="btn btn--primary" type="submit">
                Crear cuenta
              </button>
            </div>
          </form>

          <p
            id="auth-status"
            class="status"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </div>
    </section>

    <!-- App -->
    <div id="view-app" hidden>
      <header class="appbar">
        <div class="appbar__inner">
          <span class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                focusable="false"
              >
                <path d="m5 12 4.5 4.5L19 7" />
              </svg>
            </span>
            Taskify
          </span>
          <div class="appbar__user">
            <button
              id="btn-mute"
              class="btn btn--ghost btn--sm btn--icon"
              type="button"
              aria-pressed="false"
              aria-label="Silenciar"
            >
              <svg
                class="icon icon--sound"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                <path d="M18.5 5.5a9 9 0 0 1 0 13" />
              </svg>
              <svg
                class="icon icon--muted"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                <path d="m16 9 5 6" />
                <path d="m21 9-5 6" />
              </svg>
            </button>
            <span id="current-user" class="appbar__name"></span>
            <button
              id="btn-logout"
              class="btn btn--ghost btn--sm"
              type="button"
            >
              Salir
            </button>
          </div>
        </div>
      </header>

      <main id="main" class="content">
        <div
          class="viewtabs"
          role="tablist"
          aria-label="Vistas de la aplicación"
        >
          <button
            id="tab-view-tasks"
            class="tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="view-tasks"
          >
            Tareas
          </button>
          <button
            id="tab-view-calendar"
            class="tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="view-calendar"
            tabindex="-1"
          >
            Calendario
          </button>
        </div>

        <section
          id="view-tasks"
          class="view"
          role="tabpanel"
          aria-labelledby="tab-view-tasks"
        >
          <!-- Today: progress and streak -->
          <section class="today" aria-labelledby="today-title">
            <div class="today__head">
              <h2 id="today-title" class="today__title">Hoy</h2>
              <div class="today__stats">
                <span
                  id="streak"
                  class="streak"
                  title="Días seguidos completando tareas"
                >
                  <svg
                    class="streak__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
                    />
                  </svg>
                  <b>0</b>
                </span>
                <span id="day-count" class="today__count">0/0</span>
              </div>
            </div>
            <div
              id="day-progress"
              class="bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="0"
              aria-valuenow="0"
              aria-label="Tareas de hoy completadas"
            >
              <span id="day-progress-fill" class="bar__fill"></span>
            </div>
            <p id="today-note" class="today__note"></p>
          </section>

          <div class="content__head">
            <h1 class="content__title">Vencimientos</h1>
            <div class="content__tools">
              <label class="sort">
                <span class="sort__label">Orden</span>
                <span class="select">
                  <select id="sort-by" class="sort-select">
                    <option value="deadline" selected>Vencimiento</option>
                    <option value="title">Título</option>
                  </select>
                </span>
              </label>
              <button
                id="btn-new"
                class="btn btn--primary"
                type="button"
                aria-expanded="false"
                aria-controls="task-form"
              >
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                Nueva tarea
              </button>
            </div>
          </div>

          <!-- Create / edit form -->
          <form id="task-form" class="form form--task" hidden novalidate>
            <input type="hidden" name="id" />

            <label class="field">
              <span class="field__label">Título</span>
              <input name="title" required maxlength="120" />
            </label>

            <label class="field field--wide">
              <span class="field__label">Descripción</span>
              <textarea name="description" rows="3" required></textarea>
            </label>

            <label class="field">
              <span class="field__label">Fecha</span>
              <input type="datetime-local" name="date" required />
            </label>

            <label class="field">
              <span class="field__label">Vencimiento</span>
              <input type="datetime-local" name="deadline" required />
            </label>

            <div class="form__actions">
              <button id="task-submit" class="btn btn--primary" type="submit">
                Guardar
              </button>
              <button id="task-cancel" class="btn btn--ghost" type="button">
                Cancelar
              </button>
            </div>
          </form>

          <p
            id="app-status"
            class="status"
            role="status"
            aria-live="polite"
          ></p>

          <!-- Deadlines timeline -->
          <ol
            id="task-list"
            class="timeline"
            aria-label="Tareas por vencimiento"
          ></ol>

          <div id="empty-state" class="empty" hidden>
            <svg
              class="empty__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="m8.5 12 2.5 2.5 4.5-5" />
            </svg>
            <p class="empty__title">Aquí no hay nada que tachar.</p>
            <p class="empty__text">Crea tu primera tarea.</p>
          </div>
        </section>

        <section
          id="view-calendar"
          class="view"
          role="tabpanel"
          aria-labelledby="tab-view-calendar"
          hidden
        >
          <div id="cal" class="cal">
            <div class="cal__toolbar">
              <div class="cal__nav">
                <button
                  id="cal-sidebar-toggle"
                  class="btn btn--ghost btn--icon"
                  type="button"
                  aria-label="Mostrar u ocultar barra lateral"
                  aria-pressed="true"
                >
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M4 7h16M4 12h16M4 17h16" />
                  </svg>
                </button>
                <button id="cal-today" class="btn btn--sm" type="button">
                  Hoy
                </button>
                <button
                  id="cal-prev"
                  class="btn btn--ghost btn--icon"
                  type="button"
                  aria-label="Periodo anterior"
                >
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m15 18-6-6 6-6" />
                  </svg>
                </button>
                <button
                  id="cal-next"
                  class="btn btn--ghost btn--icon"
                  type="button"
                  aria-label="Periodo siguiente"
                >
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m9 18 6-6-6-6" />
                  </svg>
                </button>
                <h2 id="cal-title" class="cal__title" aria-live="polite"></h2>
              </div>
              <label class="select">
                <select
                  id="cal-view"
                  class="sort-select"
                  aria-label="Vista del calendario"
                >
                  <option value="month" selected>Mes</option>
                  <option value="week">Semana</option>
                  <option value="day">Día</option>
                  <option value="agenda">Agenda</option>
                </select>
              </label>
            </div>

            <p
              id="cal-status"
              class="status"
              role="status"
              aria-live="polite"
            ></p>

            <div class="cal__body">
              <aside
                id="cal-sidebar"
                class="cal__sidebar"
                aria-label="Navegación rápida"
              >
                <div id="cal-mini" class="cal-mini"></div>
              </aside>
              <div id="cal-main" class="cal__main"></div>
            </div>

            <div
              id="cal-popover"
              class="cal-popover"
              role="dialog"
              aria-modal="false"
              aria-label="Detalle del día"
              hidden
            ></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
