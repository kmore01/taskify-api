<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f5f6f8"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1218"
    />
    <meta
      name="description"
      content="Planifier: organiza tus eventos y planifica tu calendario."
    />
    <title>Planifier</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <section id="view-auth" class="auth" aria-labelledby="auth-title">
      <div class="auth__grid">
        <div class="auth__intro">
          <p class="brand brand--big">
            <span class="brand__mark" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                focusable="false"
              >
                <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M8 3v4M16 3v4M3.5 10h17" />
              </svg>
            </span>
            Planifier
          </p>
          <h1 id="auth-title" class="auth__title">
            Tus eventos, bien planificados.
          </h1>
          <p class="auth__lead">
            Entra o crea una cuenta para planificar tus eventos.
          </p>
        </div>

        <div class="auth__panel">
          <div class="tabs" role="tablist" aria-label="Acceso">
            <button
              id="tab-login"
              class="tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="form-login"
            >
              Entrar
            </button>
            <button
              id="tab-register"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="form-register"
              tabindex="-1"
            >
              Crear cuenta
            </button>
          </div>

          <form
            id="form-login"
            class="form"
            role="tabpanel"
            aria-labelledby="tab-login"
            novalidate
          >
            <label class="field">
              <span class="field__label">Usuario</span>
              <input name="username" autocomplete="username" required />
            </label>
            <label class="field">
              <span class="field__label">Contraseña</span>
              <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </label>
            <div class="form__actions">
              <button class="btn btn--primary" type="submit">Entrar</button>
            </div>
          </form>

          <form
            id="form-register"
            class="form"
            role="tabpanel"
            aria-labelledby="tab-register"
            hidden
            novalidate
          >
            <label class="field">
              <span class="field__label">Usuario</span>
              <input
                name="username"
                autocomplete="username"
                required
                minlength="3"
              />
            </label>
            <label class="field">
              <span class="field__label">Correo</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="field">
              <span class="field__label">Contraseña</span>
              <input
                type="password"
                name="password"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </label>
            <div class="form__actions">
              <button class="btn btn--primary" type="submit">
                Crear cuenta
              </button>
            </div>
          </form>

          <p
            id="auth-status"
            class="status"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </div>
    </section>

    <div id="view-app" hidden>
      <header class="appbar">
        <div class="appbar__inner">
          <span class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                focusable="false"
              >
                <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M8 3v4M16 3v4M3.5 10h17" />
              </svg>
            </span>
            Planifier
          </span>
          <div class="appbar__user">
            <button
              id="btn-notify"
              class="btn btn--ghost btn--sm btn--icon"
              type="button"
              aria-pressed="false"
              aria-label="Activar avisos"
              title="Activar avisos"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
              </svg>
            </button>
            <button
              id="btn-mute"
              class="btn btn--ghost btn--sm btn--icon"
              type="button"
              aria-pressed="false"
              aria-label="Silenciar"
            >
              <svg
                class="icon icon--sound"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                <path d="M18.5 5.5a9 9 0 0 1 0 13" />
              </svg>
              <svg
                class="icon icon--muted"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                <path d="m16 9 5 6" />
                <path d="m21 9-5 6" />
              </svg>
            </button>
            <span id="current-user" class="appbar__name"></span>
            <button
              id="btn-logout"
              class="btn btn--ghost btn--sm"
              type="button"
            >
              Salir
            </button>
          </div>
        </div>
      </header>

      <main id="main" class="content">
        <div
          class="viewtabs"
          role="tablist"
          aria-label="Vistas de la aplicación"
        >
          <button
            id="tab-view-events"
            class="tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="view-events"
          >
            Eventos
          </button>
          <button
            id="tab-view-calendar"
            class="tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="view-calendar"
            tabindex="-1"
          >
            Calendario
          </button>
        </div>

        <section
          id="view-events"
          class="view"
          role="tabpanel"
          aria-labelledby="tab-view-events"
        >
          <div class="content__head">
            <h1 class="content__title">Eventos</h1>
            <div class="content__tools">
              <input
                id="event-search"
                class="sort-select search"
                type="search"
                placeholder="Buscar"
                aria-label="Buscar eventos"
                autocomplete="off"
              />
              <details id="list-cats-menu" class="cal-cats-menu" hidden>
                <summary class="btn btn--sm cal-cats-menu__button">
                  Categorías
                  <span
                    id="list-cats-count"
                    class="cal-cats-menu__count"
                  ></span>
                </summary>
                <div id="list-categories" class="cal-cats"></div>
              </details>
              <label class="sort">
                <span class="sort__label">Orden</span>
                <span class="select">
                  <select id="sort-by" class="sort-select">
                    <option value="end" selected>Fin</option>
                    <option value="title">Título</option>
                  </select>
                </span>
              </label>
              <button id="btn-export" class="btn btn--ghost" type="button">
                Exportar
              </button>
              <button id="btn-import" class="btn btn--ghost" type="button">
                Importar
              </button>
              <input
                id="import-file"
                type="file"
                accept=".ics,text/calendar"
                hidden
              />
              <button
                id="btn-new"
                class="btn btn--primary"
                type="button"
                aria-expanded="false"
                aria-controls="event-form"
              >
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                Nuevo evento
              </button>
            </div>
          </div>

          <form id="event-form" class="form form--event" hidden novalidate>
            <input type="hidden" name="id" />

            <label class="field">
              <span class="field__label">Título</span>
              <input name="title" required maxlength="120" />
            </label>

            <label class="field field--wide">
              <span class="field__label">Descripción (opcional)</span>
              <textarea name="description" rows="3"></textarea>
            </label>

            <div class="field">
              <span class="field__label">Categoría</span>
              <div id="event-category"></div>
            </div>

            <label class="field">
              <span class="field__label">Inicio</span>
              <input type="datetime-local" name="start" required />
            </label>

            <label class="field">
              <span class="field__label">Fin</span>
              <input type="datetime-local" name="end" required />
            </label>

            <label class="field">
              <span class="field__label">Ubicación (opcional)</span>
              <input name="location" maxlength="120" />
            </label>

            <label class="field">
              <span class="field__label">Enlace (opcional)</span>
              <input type="url" name="link" maxlength="500" placeholder="https://" />
            </label>

            <label class="field">
              <span class="field__label">Repetir</span>
              <select name="repeat">
                <option value="none" selected>No se repite</option>
                <option value="daily">Todos los días</option>
                <option value="weekly">Todas las semanas</option>
                <option value="monthly">Todos los meses</option>
                <option value="yearly">Todos los años</option>
              </select>
            </label>

            <div class="form__actions">
              <button id="event-submit" class="btn btn--primary" type="submit">
                Guardar
              </button>
              <button id="event-cancel" class="btn btn--ghost" type="button">
                Cancelar
              </button>
            </div>
          </form>

          <p
            id="app-status"
            class="status"
            role="status"
            aria-live="polite"
          ></p>

          <ol
            id="event-list"
            class="timeline"
            aria-label="Eventos por fecha de fin"
          ></ol>

          <details id="done-section" class="done" hidden>
            <summary class="done__summary">
              Completados (<span id="done-count">0</span>)
            </summary>
            <ol
              id="done-list"
              class="timeline"
              aria-label="Eventos completados"
            ></ol>
          </details>

          <div id="empty-state" class="empty" hidden>
            <svg
              class="empty__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="m8.5 12 2.5 2.5 4.5-5" />
            </svg>
            <p id="empty-title" class="empty__title">
              Aquí no hay eventos.
            </p>
            <p id="empty-text" class="empty__text">
              Crea tu primer evento (atajo: C).
            </p>
          </div>
        </section>

        <section
          id="view-calendar"
          class="view"
          role="tabpanel"
          aria-labelledby="tab-view-calendar"
          hidden
        >
          <div id="cal" class="cal">
            <div class="cal__toolbar">
              <div class="cal__nav">
                <button
                  id="cal-sidebar-toggle"
                  class="btn btn--ghost btn--icon"
                  type="button"
                  aria-label="Mostrar u ocultar barra lateral"
                  aria-pressed="true"
                >
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M4 7h16M4 12h16M4 17h16" />
                  </svg>
                </button>
                <button id="cal-today" class="btn btn--sm" type="button">
                  Hoy
                </button>
                <button
                  id="cal-prev"
                  class="btn btn--ghost btn--icon"
                  type="button"
                  aria-label="Periodo anterior"
                >
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m15 18-6-6 6-6" />
                  </svg>
                </button>
                <button
                  id="cal-next"
                  class="btn btn--ghost btn--icon"
                  type="button"
                  aria-label="Periodo siguiente"
                >
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m9 18 6-6-6-6" />
                  </svg>
                </button>
                <h2 id="cal-title" class="cal__title" aria-live="polite"></h2>
              </div>
              <div class="cal__tools">
                <details id="cal-cats-menu" class="cal-cats-menu">
                  <summary class="btn btn--sm cal-cats-menu__button">
                    Categorías
                    <span
                      id="cal-cats-count"
                      class="cal-cats-menu__count"
                    ></span>
                  </summary>
                  <div id="cal-categories" class="cal-cats"></div>
                </details>
                <label class="select">
                  <select
                    id="cal-view"
                    class="sort-select"
                    aria-label="Vista del calendario"
                  >
                    <option value="day">Día</option>
                    <option value="week">Semana</option>
                    <option value="month" selected>Mes</option>
                    <option value="year">Año</option>
                  </select>
                </label>
              </div>
            </div>

            <p
              id="cal-status"
              class="status"
              role="status"
              aria-live="polite"
            ></p>

            <div class="cal__body">
              <aside
                id="cal-sidebar"
                class="cal__sidebar"
                aria-label="Navegación rápida"
              >
                <div id="cal-mini" class="cal-mini"></div>
              </aside>
              <div id="cal-main" class="cal__main"></div>
            </div>

            <div
              id="cal-popover"
              class="cal-popover"
              role="dialog"
              aria-modal="false"
              aria-label="Detalle del día"
              hidden
            ></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
